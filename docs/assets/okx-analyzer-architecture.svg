    <rect x="88" y="140" width="214" height="52" rx="14" fill="#082F49" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="108" y="172" fill="#E0F2FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">FRONTEND</text>
