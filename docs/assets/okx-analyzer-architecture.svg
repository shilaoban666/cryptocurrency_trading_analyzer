    <text x="680" y="418" fill="#FED7AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">OKX CONNECTOR</text>
    <g fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">
