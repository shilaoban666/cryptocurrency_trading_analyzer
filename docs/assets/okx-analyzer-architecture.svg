  <path d="M320 330 C355 330 365 330 400 330" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M880 210 C915 210 925 210 962 210" stroke="url(#green)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M880 452 C915 452 925 452 962 452" stroke="url(#orange)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M640 586 C640 620 640 622 640 650 C640 674 860 674 1087 674 C1087 620 1087 590 1087 540" stroke="url(#violet)" stroke-width="2" stroke-dasharray="7 9" opacity="0.8"/>

